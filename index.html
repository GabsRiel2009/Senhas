<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Senhas</title>
</head>

<body>

    <h1>Gerador de Senhas</h1>

    <label for="campo-senha">Senha:</label>

    <input
        type="text"
        id="campo-senha"
        readonly
    >

    <br><br>

    <div class="parametro-senha-checkbox">
        <input
            name="maiusculo"
            type="checkbox"
            class="checkbox"
            id="maiusculo"
            checked
        >
        <label for="maiusculo">Letras maiúsculas</label>
    </div>

    <div class="parametro-senha-checkbox">
        <input
            name="minusculo"
            type="checkbox"
            class="checkbox"
            id="minusculo"
        >
        <label for="minusculo">Letras minúsculas</label>
    </div>

    <div class="parametro-senha-checkbox">
        <input
            name="numero"
            type="checkbox"
            class="checkbox"
            id="numero"
        >
        <label for="numero">Números</label>
    </div>

    <br>

    <button onclick="diminuiTamanho()">-</button>

    <span id="numero-senha">8</span>

    <button onclick="aumaentaTamanho()">+</button>

    <br><br>

    <button onclick="geraSenha()">
        Gerar nova senha
    </button>

    <script src="main.js"></script>

</body>
</html>
